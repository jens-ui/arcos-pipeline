<style>
  :root{--ink:#0E1113;--ink-2:#14191C;--line:rgba(236,231,221,.11);--line-strong:rgba(236,231,221,.2);
    --bone:#ECE7DD;--mute:#8A9299;--mute-2:#626A70;--brass:#00C57E;--brass-dim:#0C8F5D;
    --sans:'Inter',-apple-system,sans-serif;--mono:'Fragment Mono',ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background-color:var(--ink);
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:44px 44px;background-position:center top;
    color:var(--bone);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .card{width:min(400px,90vw);padding:40px 36px;background:var(--ink-2);border:1px solid var(--line-strong);border-radius:4px}
  .wordmark{height:24px;width:auto;display:block;margin:0 0 28px}
  .wordmark path{fill:var(--bone)}
  .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin:0 0 8px}
  p.hint{font-size:14px;color:var(--mute);margin:0 0 24px;line-height:1.55}
  input{width:100%;padding:12px 14px;background:var(--ink);border:1px solid var(--line-strong);border-radius:3px;
    color:var(--bone);font-family:var(--mono);font-size:14px;letter-spacing:.08em;outline:none}
  input:focus-visible{border-color:var(--brass-dim);outline:1px solid var(--brass-dim)}
  button{margin-top:14px;width:100%;padding:12px;background:none;border:1px solid var(--brass-dim);border-radius:999px;
    color:var(--brass);font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
    transition:background-color .15s ease,color .15s ease}
  button:hover{background:var(--brass);color:var(--ink)}
  .err{font-family:var(--mono);font-size:12px;color:#E06A4E;margin:12px 0 0;min-height:16px}
  footer{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-family:var(--mono);
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute-2)}
</style>
</head>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b(P.salt), iterations: P.iter, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(P.iv) }, key, b(P.ct));
  return new TextDecoder().decode(pt);
}
async function go() {
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem("arc_p", pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    err.textContent = "Falsches Passwort.";
  }
}
document.getElementById("go").addEventListener("click", go);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
(async () => {
  try {
    const saved = sessionStorage.getItem("arc_p");
    if (saved) { const html = await unlock(saved); document.open(); document.write(html); document.close(); }
  } catch (e) { try { sessionStorage.removeItem("arc_p"); } catch (_) {} }
})();
